<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier 007</title><style>body{margin:0;background:#14181b;color:#e8e0c8;font:15px system-ui}.hero{text-align:center;padding:45px 20px;border-bottom:2px solid #a8853a}h1{font:56px Georgia;margin:0}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px;background:#0a0a0b;position:sticky;top:0}.tabs button{padding:10px;background:#20403d;color:#e8e0c8;border:1px solid #a8853a;cursor:pointer}.panel{display:none;max-width:900px;margin:auto;padding:25px}.panel.on{display:block}.file{background:#e8e0c8;color:#14181b;padding:16px;margin:10px 0}.quiz button{display:block;margin:8px 0;padding:10px;width:100%;text-align:left}</style></head><body><header class=hero><h1>DOSSIER 007</h1><p>Fan-encyclopédie interactive : agents, opérations, Q-Branch, garage, adversaires et débriefing.</p></header><nav class=tabs id=tabs></nav><main id=main></main><script>const panels={agents:['Agents','Sean Connery · George Lazenby · Roger Moore · Timothy Dalton · Pierce Brosnan · Daniel Craig'],operations:['Opérations','Chronologie des films officiels de 1962 à 2021, classée par interprète et époque.'],qbranch:['Q-Branch','Aston Martin DB5 · propulseur dorsal · Little Nellie · Lotus Esprit submersible · gadgets mémorables.'],garage:['Garage','DB5 · Lotus Esprit · Citroën 2CV · Aston Martin V8 · BMW Z3 · BMW Z8 · DBS · DB10.'],adversaires:['Adversaires','Dr. No · Goldfinger · Blofeld · Jaws · Drax · Scaramanga · Zorin · Trevelyan · Carver · Le Chiffre · Silva · Safin.']};const tabs=document.querySelector('#tabs'),main=document.querySelector('#main');Object.entries(panels).forEach(([id,v],n)=>{let b=document.createElement('button');b.textContent=String(n+1).padStart(2,'0')+' '+v[0];b.onclick=()=>show(id);tabs.appendChild(b);let p=document.createElement('section');p.id=id;p.className='panel';p.innerHTML='<h2>'+v[0]+'</h2><div class=file>'+v[1]+'</div>';main.appendChild(p)});let q=['Quel acteur a incarné Bond dans Dr. No ?','Quelle voiture devient un sous-marin ?','Qui dirige SPECTRE ?'];let a=[['Sean Connery','Roger Moore','Daniel Craig'],['Lotus Esprit','BMW Z3','DB5'],['Blofeld','Jaws','Renard']];let p=document.createElement('section');p.id='quiz';p.className='panel quiz';p.innerHTML='<h2>Débriefing</h2><div id=q></div>';main.appendChild(p);let qi=0,score=0;function quiz(){if(qi>=q.length){document.querySelector('#q').innerHTML='<h3>Score '+score+'/'+q.length+'</h3><button onclick="qi=0;score=0;quiz()">Recommencer</button>';return}document.querySelector('#q').innerHTML='<h3>'+q[qi]+'</h3>'+a[qi].map((x,i)=>'<button onclick="if('+i+'===0)score++;qi++;quiz()">'+x+'</button>').join('')}function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');if(id==='quiz')quiz()}show('agents')</script></body></html>
