<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier 007</title><style>:root{--bg:#080b0d;--panel:#12181b;--ink:#f4f3ed;--muted:#adb6b5;--gold:#d7b96d;--line:#3b464a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.hero{max-width:1100px;margin:auto;padding:20px}.hero-box{border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 80% 20%,#3a3020 0,#14191b 35%,#0a0d0f 75%);padding:52px 38px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.22em}.hero h1{font:700 clamp(42px,8vw,78px) Georgia,serif;margin:8px 0;text-shadow:0 2px 12px #000}.hero p{max-width:700px;color:#d8ddda;line-height:1.65}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow:auto;padding:10px max(16px,calc((100% - 1060px)/2));background:rgba(8,11,13,.98);border-block:1px solid var(--line)}.tabs button{white-space:nowrap;background:#141b1e;color:#eee;border:1px solid #4a5559;border-radius:20px;padding:10px 14px;cursor:pointer}.tabs button.active{background:var(--gold);color:#111;font-weight:800}main{max-width:1060px;margin:auto;padding:25px 20px 60px}.panel{display:none}.panel.on{display:block}.intro{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.item h3{margin:7px 0}.item p{color:#c0c7c6;line-height:1.55}.meta{color:var(--gold);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.quiz button{display:block;width:100%;max-width:720px;margin:9px 0;padding:14px;text-align:left;background:var(--panel);color:#eee;border:1px solid var(--line);border-radius:10px;cursor:pointer}.quiz button:hover{border-color:var(--gold)}.result{background:#eee6d5;color:#16191a;padding:18px;border-radius:14px;max-width:720px}.result button{color:#111;background:#d7b96d;border-color:#d7b96d;text-align:center}@media(max-width:600px){.hero{padding:10px}.hero-box{padding:34px 22px}.hero h1{font-size:46px}}
</style></head><body><header class="hero"><div class="hero-box"><div class="eyebrow">MI6 · ARCHIVES · 007</div><h1>DOSSIER 007</h1><p>Une fiche interactive consacrée à James Bond : agents, chronologie, gadgets, voitures, adversaires et quiz.</p></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main><script>const panels={agents:{title:'Agents',intro:'Les interprètes officiels de Bond au cinéma, replacés dans leur époque.',content:[['Sean Connery','1962–1967 · 1971','Le Bond fondateur de la série cinématographique.'],['George Lazenby','1969','Une seule aventure officielle : Au service secret de Sa Majesté.'],['Roger Moore','1973–1985','Une période plus légère et spectaculaire.'],['Timothy Dalton','1987–1989','Un Bond plus sombre et tendu.'],['Pierce Brosnan','1995–2002','Retour de la franchise avec une forte place donnée à la technologie.'],['Daniel Craig','2006–2021','Une période modernisée avec une continuité narrative plus forte.']]},operations:{title:'Opérations',intro:'Une lecture chronologique des grandes périodes de la saga.',content:[['1962–1971','Dr. No → Les diamants sont éternels','Installation du personnage et des codes de la série.'],['1973–1985','Vivre et laisser mourir → Dangereusement vôtre','Ère Roger Moore : humour, gadgets et grand spectacle.'],['1987–1989','Tuer n’est pas jouer → Permis de tuer','Deux missions avec Timothy Dalton.'],['1995–2002','GoldenEye → Meurs un autre jour','Retour avec Pierce Brosnan.'],['2006–2021','Casino Royale → Mourir peut attendre','Nouvelle continuité autour de Daniel Craig.']]},qbranch:{title:'Q-Branch',intro:'Les gadgets qui résument l’identité technologique de 007.',content:[['Communications','Émetteurs, téléphones et dispositifs d’écoute','La technologie sert l’enquête et la coordination.'],['Gadgets','Montres, stylos et accessoires truqués','Des objets ordinaires transformés en outils de mission.'],['Véhicules spéciaux','DB5, Lotus Esprit, Little Nellie','Le véhicule devient un équipement de mission.'],['Principe Q','Préparer Bond avant la mission','Briefing, équipement et contraintes.']]},garage:{title:'Garage',intro:'Quelques véhicules emblématiques de la saga.',content:[['Aston Martin DB5','Goldfinger · 1964','Le modèle le plus associé à l’imaginaire 007.'],['Lotus Esprit','L’Espion qui m’aimait · 1977','La voiture capable de se transformer en sous-marin.'],['Aston Martin V8','Tuer n’est pas jouer · 1987','Une signature automobile de l’ère Dalton.'],['BMW Z3 / Z8','GoldenEye · 1995 / Le monde ne suffit pas · 1999','Deux modèles de la période Brosnan.'],['DBS / DB10','Casino Royale · 2006 / Spectre · 2015','Deux signatures automobiles de la période Craig.']]},adversaires:{title:'Adversaires',intro:'Les antagonistes structurent les missions autant que les gadgets.',content:[['Dr. No','Dr. No','Premier grand adversaire du cinéma Bond.'],['Auric Goldfinger','Goldfinger','Un industriel au centre d’une opération spectaculaire.'],['Ernst Stavro Blofeld','Plusieurs films','Figure centrale de SPECTRE.'],['Jaws','L’Espion qui m’aimait / Moonraker','Adversaire physique récurrent de l’ère Moore.'],['Alec Trevelyan','GoldenEye','Un ancien agent qui connaît intimement le monde de Bond.'],['Le Chiffre','Casino Royale','Adversaire lié à la partie de poker.'],['Raoul Silva','Skyfall','Un adversaire personnellement lié à M.'],['Lyutsifer Safin','Mourir peut attendre','Adversaire de la dernière aventure de Daniel Craig.']]}};const tabs=document.getElementById('tabs'),main=document.getElementById('main');function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function show(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.id===id))}Object.entries(panels).forEach(([id,p],n)=>{const b=document.createElement('button');b.dataset.id=id;b.textContent=String(n+1).padStart(2,'0')+' · '+p.title;b.onclick=()=>show(id);tabs.appendChild(b);const sec=document.createElement('section');sec.id=id;sec.className='panel';sec.innerHTML='<p class="intro">'+p.intro+'</p><div class="grid">'+p.content.map(x=>'<article class="item"><div class="meta">'+esc(x[0])+'</div><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></article>').join('')+'</div>';main.appendChild(sec)});const quiz=document.createElement('section');quiz.id='quiz';quiz.className='panel quiz';quiz.innerHTML='<p class="intro">Teste tes connaissances sur l’univers 007.</p><div id="q"></div>';main.appendChild(quiz);const questions=[['Quel acteur inaugure la série officielle avec Dr. No ?',['Sean Connery','Roger Moore','Pierce Brosnan'],0],['Quel véhicule devient un sous-marin ?',['Lotus Esprit','Aston Martin DB5','BMW Z3'],0],['Quel personnage est associé à SPECTRE ?',['Blofeld','Scaramanga','Carver'],0],['Quel film inaugure la période Daniel Craig ?',['Casino Royale','Skyfall','Spectre'],0]];let qi=0,score=0;function drawQuiz(){const q=document.getElementById('q');if(qi>=questions.length){q.innerHTML='<div class="result"><strong>Score : '+score+'/'+questions.length+'</strong><br><br><button onclick="qi=0;score=0;drawQuiz()">Recommencer</button></div>';return}const item=questions[qi];q.innerHTML='<h2>'+esc(item[0])+'</h2>'+item[1].map((o,i)=>'<button onclick="answer('+i+')">'+esc(o)+'</button>').join('')}window.answer=i=>{if(i===questions[qi][2])score++;qi++;drawQuiz()};show('agents');</script></body></html>
