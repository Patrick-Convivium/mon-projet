<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier 007</title><style>:root{--bg:#090c0e;--panel:#11171a;--paper:#eee6d2;--gold:#c8a65a;--muted:#9da5a6;--line:#354044}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182126 0,#090c0e 55%);color:#eee;font:15px system-ui,-apple-system,sans-serif}.hero{position:relative;min-height:360px;display:grid;align-items:end;overflow:hidden;border-bottom:1px solid var(--gold)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32;filter:grayscale(1) contrast(1.1)}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#090c0e 3%,transparent 70%)}.hero-content{position:relative;z-index:1;max-width:1050px;width:100%;margin:auto;padding:48px 22px 36px}.eyebrow{letter-spacing:.2em;color:var(--gold);font-size:12px;font-weight:800}.hero h1{font:clamp(44px,9vw,88px) Georgia;margin:8px 0 4px}.hero p{max-width:650px;color:#d3d5d2}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow:auto;padding:10px max(16px,calc((100% - 1050px)/2));background:rgba(9,12,14,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;border:1px solid #495459;background:#12191c;color:#e8e0c8;padding:10px 13px;border-radius:999px;cursor:pointer}.tabs button.active{background:var(--gold);color:#111;border-color:var(--gold)}main{max-width:1050px;margin:auto;padding:28px 20px 60px}.panel{display:none}.panel.on{display:block}.intro{color:var(--muted);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.file{background:var(--paper);color:#171a1b;padding:20px;border-radius:16px;border:1px solid #d1c4a6}.file h3{margin-top:0}.meta{color:#756d5b;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.item h3{margin:6px 0}.item p{color:#b9c0c0;line-height:1.5}.tag{display:inline-block;border:1px solid #536067;border-radius:999px;padding:4px 8px;margin:3px;color:#d9c27d;font-size:12px}.timeline{border-left:2px solid var(--gold);padding-left:18px}.timeline .item{margin:0 0 12px}.quiz button{display:block;width:100%;margin:9px 0;padding:13px;text-align:left;border:1px solid var(--line);background:#11171a;color:#eee;border-radius:10px;cursor:pointer}.quiz button:hover{border-color:var(--gold)}@media(max-width:650px){.hero{min-height:300px}}</style></head><body><header class="hero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Sean%20Connery%20the%20First%20James%20Bond.png" alt="Sean Connery interprétant James Bond" loading="lazy"><div class="hero-content"><div class="eyebrow">MI6 · ARCHIVES</div><h1>DOSSIER 007</h1><p>Une fiche interactive consacrée à James Bond : acteurs, chronologie, gadgets, voitures et adversaires.</p></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main><script>const panels={agents:{title:'Agents',intro:'Les interprètes officiels de Bond au cinéma, replacés dans leur époque.',content:[['Sean Connery','1962–1967 · 1971','Le Bond fondateur de la série cinématographique.'],['George Lazenby','1969','Une seule aventure officielle : Au service secret de Sa Majesté.'],['Roger Moore','1973–1985','Une période plus légère et volontiers spectaculaire.'],['Timothy Dalton','1987–1989','Un Bond plus sombre et plus proche de la tension du roman.'],['Pierce Brosnan','1995–2002','Retour à une production très technologique et spectaculaire.'],['Daniel Craig','2006–2021','Une période modernisée, avec une continuité narrative plus forte.']]},operations:{title:'Opérations',intro:'La chronologie permet de parcourir l’évolution de 007 plutôt que de seulement lister les films.',content:[['1962–1971','Dr. No → Les diamants sont éternels','Installation du personnage et des codes de la série.'],['1973–1985','Vivre et laisser mourir → Dangereusement vôtre','Ère Roger Moore : humour, gadgets et grand spectacle.'],['1987–1989','Tuer n’est pas jouer → Permis de tuer','Deux missions avec Timothy Dalton.'],['1995–2002','GoldenEye → Meurs un autre jour','Retour de la franchise avec Brosnan.'],['2006–2021','Casino Royale → Mourir peut attendre','Nouvelle continuité autour de Craig.']]},qbranch:{title:'Q-Branch',intro:'Les gadgets qui résument l’identité technologique de 007.',content:[['Communicateurs','Émetteurs, téléphones et dispositifs d’écoute','La technologie sert autant l’enquête que la mise en scène.'],['Gadgets défensifs','Montre, stylo, chaussures et accessoires truqués','Objets ordinaires transformés en outils d’espionnage.'],['Véhicules spéciaux','DB5, Lotus Esprit, Little Nellie','Le véhicule devient un véritable équipement de mission.'],['Principe Q','Préparer Bond avant la mission','Briefing, équipement et contraintes font partie du rituel 007.']]},garage:{title:'Garage',intro:'Quelques véhicules emblématiques de la saga.',content:[['Aston Martin DB5','Goldfinger · 1964','Le modèle le plus associé à l’imaginaire 007.'],['Lotus Esprit','L’Espion qui m’aimait · 1977','La voiture capable de se transformer en sous-marin.'],['Aston Martin V8','Tuer n’est pas jouer · 1987','Une voiture adaptée à une séquence de poursuite mémorable.'],['BMW Z3 / Z8','GoldenEye · 1995 / Le monde ne suffit pas · 1999','La période Brosnan associe Bond à des modèles plus contemporains.'],['Aston Martin DBS / DB10','Casino Royale · 2006 / Spectre · 2015','Deux générations de Bond et deux signatures automobiles.']]},adversaires:{title:'Adversaires',intro:'Les antagonistes structurent les missions autant que les gadgets.',content:[['Dr. No','Dr. No','Premier grand adversaire du cinéma Bond.'],['Auric Goldfinger','Goldfinger','Un industriel obsédé par l’or et une opération spectaculaire.'],['Ernst Stavro Blofeld','Plusieurs films','Figure centrale de SPECTRE dans plusieurs périodes de la saga.'],['Jaws','L’Espion qui m’aimait / Moonraker','Adversaire physique récurrent de l’ère Moore.'],['Alec Trevelyan','GoldenEye','Un ancien agent qui connaît intimement le monde de Bond.'],['Le Chiffre','Casino Royale','Adversaire lié à la partie de poker qui structure le film.'],['Raoul Silva','Skyfall','Un adversaire personnellement lié à M.'],['Lyutsifer Safin','Mourir peut attendre','Adversaire de la dernière aventure de Daniel Craig.']]}};const tabs=document.querySelector('#tabs'),main=document.querySelector('#main');function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}Object.entries(panels).forEach(([id,v],n)=>{const b=document.createElement('button');b.textContent=String(n+1).padStart(2,'0')+' · '+v.title;b.onclick=()=>show(id);b.dataset.id=id;tabs.appendChild(b);const p=document.createElement('section');p.id=id;p.className='panel';p.innerHTML='<p class="intro">'+v.intro+'</p><div class="grid">'+v.content.map(x=>'<article class="item"><div class="meta">'+esc(x[0])+'</div><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></article>').join('')+'</div>';main.appendChild(p)});const quiz=document.createElement('section');quiz.id='quiz';quiz.className='panel quiz';quiz.innerHTML='<p class="intro">Teste tes connaissances sur l’univers 007.</p><div id="q"></div>';main.appendChild(quiz);const questions=[['Quel acteur inaugure la série officielle avec Dr. No ?',['Sean Connery','Roger Moore','Pierce Brosnan']],['Quel véhicule devient un sous-marin ?',['Lotus Esprit','Aston Martin DB5','BMW Z3']],['Quel personnage est associé à SPECTRE ?',['Blofeld','Scaramanga','Carver']]],['Quel film inaugure la période Daniel Craig ?',['Casino Royale','Skyfall','Spectre']]];let qi=0,score=0;function drawQuiz(){const box=document.querySelector('#q');if(qi>=questions.length){box.innerHTML='<div class="file"><h2>Débriefing</h2><p>Score : <strong>'+score+'/'+questions.length+'</strong></p><button onclick="qi=0;score=0;drawQuiz()">Recommencer</button></div>';return}const [q,opts]=questions[qi];box.innerHTML='<h2>'+q+'</h2>'+opts.map((x,i)=>'<button onclick="answer('+i+')">'+esc(x)+'</button>').join('')}window.answer=i=>{if((qi===0&&i===0)||(qi===1&&i===0)||(qi===2&&i===0)||(qi===3&&i===0))score++;qi++;drawQuiz()};function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='quiz')drawQuiz()}show('agents');</script></body></html>
