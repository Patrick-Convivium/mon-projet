<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier 007</title><style>:root{--bg:#070a0b;--panel:#101618;--panel2:#151d20;--ink:#f1f0e9;--muted:#aeb7b5;--gold:#d5b66a;--line:#3a474b;--red:#a83d3d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#080b0d,#0d1315 50%,#080b0d);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.hero{min-height:390px;position:relative;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--gold);background:#111}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:.48;filter:grayscale(.35) contrast(1.05)}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,9,.96) 0%,rgba(5,8,9,.72) 42%,rgba(5,8,9,.18) 100%);z-index:1}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#080b0d 0%,transparent 45%);z-index:1}.hero-content{position:relative;z-index:2;max-width:1100px;width:100%;margin:auto;padding:70px 22px 38px}.eyebrow{letter-spacing:.22em;color:var(--gold);font-size:12px;font-weight:800}.hero h1{font:clamp(42px,8vw,82px) Georgia,serif;margin:8px 0;color:#fff;text-shadow:0 2px 18px #000}.hero p{max-width:680px;color:#d9ddda;line-height:1.6}.tabs{position:sticky;top:0;z-index:10;display:flex;gap:7px;overflow:auto;padding:10px max(16px,calc((100% - 1100px)/2));background:rgba(7,10,11,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;border:1px solid #4c595d;background:#11191c;color:#eee;padding:10px 14px;border-radius:999px;cursor:pointer}.tabs button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}main{max-width:1100px;margin:auto;padding:30px 20px 70px}.panel{display:none}.panel.on{display:block}.intro{color:var(--muted);line-height:1.6;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.item{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 12px 30px #0004}.item:hover{border-color:#7b6a3e;transform:translateY(-2px)}.item h3{margin:7px 0;font-size:19px}.item p{color:#c1c8c7;line-height:1.55}.meta{color:var(--gold);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.timeline{border-left:2px solid var(--gold);padding-left:18px}.timeline .item{margin-bottom:12px}.file{background:#ece5d5;color:#171a1b;padding:20px;border-radius:16px}.file p{color:#4f514e}.quiz h2{font-size:22px}.quiz button{display:block;width:100%;margin:9px 0;padding:14px;text-align:left;border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:11px;cursor:pointer}.quiz button:hover{border-color:var(--gold);background:#182124}.source{margin-top:22px;color:#7f8988;font-size:12px}.source a{color:#cbb16b}@media(max-width:650px){.hero{min-height:330px}.hero img{object-position:58% center}.hero:before{background:linear-gradient(0deg,rgba(5,8,9,.97) 0%,rgba(5,8,9,.58) 70%,rgba(5,8,9,.3) 100%)}}
</style></head><body><header class="hero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Sean%20Connery%20the%20First%20James%20Bond.png" alt="Sean Connery interprétant James Bond"><div class="hero-content"><div class="eyebrow">MI6 · ARCHIVES · 007</div><h1>DOSSIER 007</h1><p>Une fiche interactive consacrée à James Bond : agents, chronologie, gadgets, voitures et adversaires.</p></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main><script>const panels={agents:{title:'Agents',intro:'Les interprètes officiels de Bond au cinéma, replacés dans leur époque.',content:[['Sean Connery','1962–1967 · 1971','Le Bond fondateur de la série cinématographique.'],['George Lazenby','1969','Une seule aventure officielle : Au service secret de Sa Majesté.'],['Roger Moore','1973–1985','Une période plus légère et volontiers spectaculaire.'],['Timothy Dalton','1987–1989','Un Bond plus sombre et proche de la tension du roman.'],['Pierce Brosnan','1995–2002','Retour de la franchise avec une forte place donnée à la technologie et au spectacle.'],['Daniel Craig','2006–2021','Une période modernisée, avec une continuité narrative plus forte.']]},operations:{title:'Opérations',intro:'Une lecture chronologique des grandes périodes de la saga.',content:[['1962–1971','Dr. No → Les diamants sont éternels','Installation du personnage et des codes de la série.'],['1973–1985','Vivre et laisser mourir → Dangereusement vôtre','Ère Roger Moore : humour, gadgets et grand spectacle.'],['1987–1989','Tuer n’est pas jouer → Permis de tuer','Deux missions avec Timothy Dalton.'],['1995–2002','GoldenEye → Meurs un autre jour','Retour de la franchise avec Pierce Brosnan.'],['2006–2021','Casino Royale → Mourir peut attendre','Nouvelle continuité autour de Daniel Craig.']]},qbranch:{title:'Q-Branch',intro:'Les gadgets qui résument l’identité technologique de 007.',content:[['Communicateurs','Émetteurs, téléphones et dispositifs d’écoute','La technologie sert l’enquête, la coordination et la mise en scène.'],['Gadgets défensifs','Montres, stylos et accessoires truqués','Des objets ordinaires transformés en outils d’espionnage.'],['Véhicules spéciaux','DB5, Lotus Esprit, Little Nellie','Le véhicule devient un véritable équipement de mission.'],['Principe Q','Préparer Bond avant la mission','Briefing, équipement et contraintes font partie du rituel 007.']]},garage:{title:'Garage',intro:'Quelques véhicules emblématiques de la saga.',content:[['Aston Martin DB5','Goldfinger · 1964','Le modèle le plus associé à l’imaginaire 007.'],['Lotus Esprit','L’Espion qui m’aimait · 1977','La voiture capable de se transformer en sous-marin.'],['Aston Martin V8','Tuer n’est pas jouer · 1987','Une voiture adaptée à une séquence de poursuite mémorable.'],['BMW Z3 / Z8','GoldenEye · 1995 / Le monde ne suffit pas · 1999','La période Brosnan associe Bond à des modèles plus contemporains.'],['Aston Martin DBS / DB10','Casino Royale · 2006 / Spectre · 2015','Deux générations de Bond et deux signatures automobiles.']]},adversaires:{title:'Adversaires',intro:'Les antagonistes structurent les missions autant que les gadgets.',content:[['Dr. No','Dr. No','Premier grand adversaire du cinéma Bond.'],['Auric Goldfinger','Goldfinger','Un industriel obsédé par l’or et une opération spectaculaire.'],['Ernst Stavro Blofeld','Plusieurs films','Figure centrale de SPECTRE dans plusieurs périodes de la saga.'],['Jaws','L’Espion qui m’aimait / Moonraker','Adversaire physique récurrent de l’ère Moore.'],['Alec Trevelyan','GoldenEye','Un ancien agent qui connaît intimement le monde de Bond.'],['Le Chiffre','Casino Royale','Adversaire lié à la partie de poker qui structure le film.'],['Raoul Silva','Skyfall','Un adversaire personnellement lié à M.'],['Lyutsifer Safin','Mourir peut attendre','Adversaire de la dernière aventure de Daniel Craig.']]}};const tabs=document.querySelector('#tabs'),main=document.querySelector('#main');function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}Object.entries(panels).forEach(([id,v],n)=>{const b=document.createElement('button');b.textContent=String(n+1).padStart(2,'0')+' · '+v.title;b.onclick=()=>show(id);b.dataset.id=id;tabs.appendChild(b);const p=document.createElement('section');p.id=id;p.className='panel';p.innerHTML='<p class="intro">'+v.intro+'</p><div class="grid">'+v.content.map(x=>'<article class="item"><div class="meta">'+esc(x[0])+'</div><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></article>').join('')+'</div>';main.appendChild(p)});const quiz=document.createElement('section');quiz.id='quiz';quiz.className='panel quiz';quiz.innerHTML='<p class="intro">Teste tes connaissances sur l’univers 007.</p><div id="q"></div>';main.appendChild(quiz);const questions=[['Quel acteur inaugure la série officielle avec Dr. No ?',['Sean Connery','Roger Moore','Pierce Brosnan']],['Quel véhicule devient un sous-marin ?',['Lotus Esprit','Aston Martin DB5','BMW Z3']],['Quel personnage est associé à SPECTRE ?',['Blofeld','Scaramanga','Carver']],['Quel film inaugure la période Daniel Craig ?',['Casino Royale','Skyfall','Spectre']]];let qi=0,score=0;function drawQuiz(){const box=document.querySelector('#q');if(qi>=questions.length){box.innerHTML='<div class="file"><h2>Débriefing</h2><p>Score : <strong>'+score+'/'+questions.length+'</strong></p><button onclick="qi=0;score=0;drawQuiz()">Recommencer</button></div>';return}const [q,opts]=questions[qi];box.innerHTML='<h2>'+q+'</h2>'+opts.map((x,i)=>'<button onclick="answer('+i+')">'+esc(x)+'</button>').join('')}window.answer=i=>{if(i===0)score++;qi++;drawQuiz()};function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='quiz')drawQuiz()}show('agents');</script></body></html>
