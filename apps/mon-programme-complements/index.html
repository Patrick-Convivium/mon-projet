<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon programme de compléments</title><style>body{font:15px system-ui;background:#edf0e4;color:#1e3a2f;margin:0;padding:25px}.wrap{max-width:900px;margin:auto}.panel{background:#fff;padding:18px;border:1px solid #d8dcc9;border-radius:12px;margin:12px 0}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.slot{padding:14px;background:#fbfbf7;border:1px solid #d8dcc9;border-radius:10px}.chip{display:inline-block;background:#e9e8e0;padding:6px 10px;border-radius:20px;margin:4px}input,button,select{padding:9px;border:1px solid #ccd4c9;border-radius:7px}button{background:#1e3a2f;color:white;cursor:pointer}@media(max-width:650px){.timeline{grid-template-columns:1fr}}</style></head><body><div class=wrap><h1>Mon programme de compléments</h1><p>Organise tes prises matin / midi / soir. Ceci n'est pas un avis médical.</p><div class=panel><input id=n placeholder="Nom du complément"><select id=m><option value=matin>Matin</option><option value=midi>Midi</option><option value=soir>Soir</option></select><button onclick=add()>Ajouter</button><div id=chips></div></div><div class=timeline id=timeline></div></div><script>let a=JSON.parse(localStorage.getItem('supps')||'[]');function add(){if(!n.value.trim())return;a.push({n:n.value.trim(),m:m.value});localStorage.setItem('supps',JSON.stringify(a));n.value='';render()}function render(){chips.innerHTML=a.map((x,i)=>`<span class=chip>${x.n} <button onclick="a.splice(${i},1);localStorage.setItem('supps',JSON.stringify(a));render()">×</button></span>`).join('');timeline.innerHTML=['matin','midi','soir'].map(x=>`<div class=slot><h3>${x[0].toUpperCase()+x.slice(1)}</h3>${a.filter(y=>y.m===x).map(y=>`<p>• ${y.n}</p>`).join('')||'<small>Rien</small>'}</div>`).join('')}render()</script></body></html>
