<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Carnet de Défis</title><style>body{margin:0;background:#1f3d2e;color:#f4f1e8;font:16px system-ui;padding:24px}.wrap{max-width:760px;margin:auto}h1{font-size:36px}.card{background:#f4f1e8;color:#222;padding:18px;margin:14px 0;border-radius:6px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;border-radius:8px;border:1px solid #aaa}button{cursor:pointer;background:#f2c14e;font-weight:700}.entry{border-top:1px solid #ccc;padding:8px 0}</style></head><body><div class="wrap"><h1>Le Carnet de Défis</h1><p>Crée tes défis, note tes scores et valide tes réussites. Les données restent dans ce navigateur.</p><button onclick="newChallenge()">+ Nouveau défi</button><div id="app"></div></div><script>const K='challenge-board-v1';let data=JSON.parse(localStorage.getItem(K)||'[]');function save(){localStorage.setItem(K,JSON.stringify(data));render()}function newChallenge(){const t=prompt('Nom du défi');if(!t)return;data.unshift({t,desc:prompt('Description')||'',entries:[]});save()}function add(i){const n=prompt('Ton nom');if(!n)return;const s=prompt('Score (facultatif)');data[i].entries.unshift({n,s,ok:confirm('Défi validé ?'),d:new Date().toLocaleDateString('fr-FR')});save()}function render(){app.innerHTML=data.length?data.map((c,i)=>`<div class="card"><h2>${esc(c.t)}</h2><p>${esc(c.desc)}</p><button onclick="add(${i})">Signer un résultat</button><div>${c.entries.map(e=>`<div class=entry><b>${esc(e.n)}</b> ${e.s?'- '+esc(e.s):''} ${e.ok?'✓ validé':''}<small> · ${e.d}</small></div>`).join('')||'<p>Aucun résultat.</p>'}</div></div>`).join(''):'<p>Aucun défi. Crée le premier.</p>'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render()</script></body></html>
