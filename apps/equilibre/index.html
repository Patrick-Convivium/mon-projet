<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Équilibre</title><style>body{margin:0;background:#e7ecea;color:#1b2320;font:14px system-ui;padding:24px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:120px repeat(7,1fr);min-width:760px}.cell,.head{padding:10px;border:1px solid #d2dbd6;background:#fff}.scroll{overflow:auto}.add{padding:12px;background:#fff;border:1px solid #d2dbd6;margin-bottom:15px}input,select,button{padding:8px;border:1px solid #ccd5d0;border-radius:6px}</style></head><body><div class=wrap><h1>Équilibre — Planning des disciplines</h1><div class=add><input id=name placeholder="Nom de discipline"><select id=cat><option>Force</option><option>Cardio</option><option>Mobilité</option><option>Récupération</option></select><button onclick=add()>Ajouter</button></div><div class=scroll><div class=grid id=grid></div></div></div><script>let items=JSON.parse(localStorage.getItem('equilibre')||'[]');function add(){let n=name.value.trim();if(!n)return;items.push({n,c:cat.value});localStorage.setItem('equilibre',JSON.stringify(items));name.value='';render()}function render(){let days=['Discipline','Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];grid.innerHTML=days.map(x=>`<div class=head><b>${x}</b></div>`).join('')+items.map((x,i)=>`<div class=cell><b>${x.n}</b><small>${x.c}</small></div>`+days.slice(1).map(d=>`<div class=cell><input type=checkbox onchange="this.checked&&this.parentNode.classList.add('done')"></div>`).join('')).join('')}render()</script></body></html>
