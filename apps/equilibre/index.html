<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Équilibre</title><style>:root{--bg:#eef3f0;--ink:#18231f;--muted:#65736d;--card:#fff;--line:#d6e0db;--accent:#3f6b5b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef3f0,#e3ebe7);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1150px;margin:auto;padding:28px 18px 60px}header{margin-bottom:20px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 6px}.lead{color:var(--muted);max-width:720px}.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:22px 0}.profile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;text-align:left;cursor:pointer}.profile:hover,.profile.active{border-color:var(--accent);box-shadow:0 8px 24px #1b342513}.profile strong{display:block;font-size:17px}.profile span{display:block;color:var(--muted);margin-top:5px;font-size:13px}.plan{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.plan-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.badge{display:inline-block;background:#e5eee9;color:#315747;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px}.day{border:1px solid var(--line);border-radius:14px;padding:11px;min-height:120px}.day b{font-size:12px}.slot{margin-top:8px;padding:8px;border-radius:9px;background:#f1f5f3;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,input,select{font:inherit}.actions button,.add button{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:white;cursor:pointer}.secondary{background:#e8eeeb!important;color:var(--ink)!important}.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.add input,.add select{border:1px solid var(--line);background:white;border-radius:10px;padding:10px}@media(max-width:800px){.days{grid-template-columns:1fr 1fr}.day{min-height:auto}}@media(max-width:480px){.days{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><h1>Équilibre</h1><p class="lead">Construis une semaine réaliste à partir de ton profil : régulier, sportif, sédentaire, stressé ou récupération prioritaire. L'objectif est la cohérence, pas la surcharge.</p></header><section><h2>Choisis un profil de départ</h2><div class="profiles" id="profiles"></div></section><section class="plan"><div class="plan-head"><div><span class="badge" id="badge"></span><h2 id="planTitle"></h2><p id="planIntro" class="lead"></p></div><button class="secondary" onclick="resetPlan()">Réinitialiser</button></div><div class="days" id="days"></div><div class="actions"><button onclick="savePlan()">Sauvegarder ce planning</button><button class="secondary" onclick="randomPlan()">Changer de proposition</button></div></section><section class="add"><input id="custom" placeholder="Ajouter une activité personnelle"><select id="customCat"><option>Force</option><option>Cardio</option><option>Mobilité</option><option>Récupération</option><option>Loisir</option></select><button onclick="addCustom()">Ajouter au planning</button></section></div><script>const profiles={regulier:{name:'Régulier équilibré',tag:'Base polyvalente',intro:'Pour quelqu’un qui veut entretenir plusieurs qualités sans consacrer toute sa semaine au sport.',days:[['Lun','Force · 45 min','Marche 20 min'],['Mar','Cardio · 30 min','Mobilité 10 min'],['Mer','Récupération','Marche libre'],['Jeu','Force · 45 min','Mobilité 10 min'],['Ven','Cardio léger · 25 min','Loisir'],['Sam','Activité plaisir','Promenade'],['Dim','Repos actif','Étirements doux']]},sportif:{name:'Sportif régulier',tag:'Volume modéré',intro:'Pour une personne déjà habituée à l'entraînement et capable de récupérer entre les séances.',days:[['Lun','Force · 60 min','Mobilité'],['Mar','Cardio · 45 min','Récupération'],['Mer','Force · 45 min','Marche'],['Jeu','Cardio · 40 min','Mobilité'],['Ven','Repos','Marche légère'],['Sam','Séance longue / sport','Récupération'],['Dim','Repos actif','Mobilité']]},sedentaire:{name:'Reprise / sédentaire',tag:'Progressif',intro:'Pour reprendre sans chercher immédiatement l’intensité : priorité à la fréquence et au mouvement quotidien.',days:[['Lun','Marche · 25 min','Mobilité 5 min'],['Mar','Repos actif','Marche 15 min'],['Mer','Renforcement · 20 min','Mobilité'],['Jeu','Marche · 30 min','Respiration'],['Ven','Repos','Marche libre'],['Sam','Activité plaisir · 30 min','Mobilité'],['Dim','Repos actif','Promenade']]},stress:{name:'Stress / charge mentale',tag:'Décompression',intro:'Pour organiser le mouvement autour de la récupération et éviter d’ajouter une contrainte de plus.',days:[['Lun','Marche · 20 min','Respiration'],['Mar','Mobilité · 15 min','Repos'],['Mer','Force légère · 25 min','Promenade'],['Jeu','Récupération','Respiration'],['Ven','Cardio doux · 20 min','Loisir'],['Sam','Activité plaisir','Sans objectif'],['Dim','Repos','Promenade tranquille']]},recovery:{name:'Récupération prioritaire',tag:'Faible charge',intro:'Pour une semaine où la récupération passe avant la performance. En cas de douleur ou problème de santé, demander un avis professionnel.',days:[['Lun','Mobilité douce · 15 min','Marche courte'],['Mar','Repos','Respiration'],['Mer','Marche · 20 min','Mobilité'],['Jeu','Repos','Loisir calme'],['Ven','Renforcement léger · 20 min','Mobilité'],['Sam','Promenade','Repos'],['Dim','Repos','Préparer la semaine']]}};let current='regulier',custom=[];const profilesEl=document.querySelector('#profiles');Object.entries(profiles).forEach(([id,p])=>{const b=document.createElement('button');b.className='profile';b.dataset.id=id;b.innerHTML='<strong>'+p.name+'</strong><span>'+p.tag+'</span>';b.onclick=()=>selectProfile(id);profilesEl.appendChild(b)});function selectProfile(id){current=id;document.querySelectorAll('.profile').forEach(x=>x.classList.toggle('active',x.dataset.id===id));render()}function render(){const p=profiles[current];badge.textContent=p.tag;planTitle.textContent=p.name;planIntro.textContent=p.intro;days.innerHTML=p.days.map(d=>'<article class="day"><b>'+d[0]+'</b><div class="slot">'+d[1]+'</div><div class="slot">'+d[2]+'</div></article>').join('')+custom.map(d=>'<article class="day"><b>Perso</b><div class="slot">'+d.n+' · '+d.c+'</div></article>').join('')}function addCustom(){const n=custom.value.trim();if(!n)return;custom.push({n,c:customCat.value});custom.value='';render()}function randomPlan(){const keys=Object.keys(profiles);selectProfile(keys[Math.floor(Math.random()*keys.length)])}function savePlan(){localStorage.setItem('equilibre-plan',JSON.stringify({current,custom}));alert('Planning sauvegardé sur cet appareil.')}function resetPlan(){custom=[];localStorage.removeItem('equilibre-plan');render()}const saved=JSON.parse(localStorage.getItem('equilibre-plan')||'null');if(saved&&profiles[saved.current]){current=saved.current;custom=saved.custom||[]}selectProfile(current);</script></body></html>
