<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossiers Réalité</title><style>body{margin:0;background:#14171c;color:#ede8dd;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#f1e9da;color:#241f18;padding:18px;margin:12px 0;border-radius:4px}button{padding:9px 12px;border:0;background:#d9a441;cursor:pointer}.chips button{margin:4px}</style></head><body><div class=wrap><h1>Dossiers Réalité, sans artifice</h1><p>Analyse les mécanismes de formats de téléréalité et note comment reproduire leurs ressorts sans artifice.</p><div id=filters class=chips></div><div id=app></div></div><script>const data=[['Koh-Lanta','Survie · épreuves · élimination · tension'],["L'Amour est dans le pré",'Rencontres · romance · confessionnal'],['Pékin Express','Épreuve · chronomètre · décor · tension'],['Top Chef','Expertise · jury · épreuve · chronomètre'],['Mariés au premier regard','Casting · compatibilité · romance'],['Secret Story','Huis clos · secrets · suspense · second écran']];let f='Tous';filters.innerHTML=['Tous','Épreuve','Romance','Tension','Casting'].map(x=>`<button onclick="f='${x}';render()">${x}</button>`).join('');function render(){app.innerHTML=data.filter(x=>f==='Tous'||x[1].toLowerCase().includes(f.toLowerCase())).map(x=>`<article class=card><h2>${x[0]}</h2><p>${x[1]}</p><textarea rows=3 style="width:100%" placeholder="Tes notes : comment reproduire le mécanisme sans artifice ?"></textarea></article>`).join('')}render()</script></body></html>
