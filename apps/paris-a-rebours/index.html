<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paris — À Rebours</title><style>body{margin:0;background:#1c1916;color:#eee7d6;font:14px monospace;padding:25px}.wrap{max-width:800px;margin:auto}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button,.card button{background:none;border:1px solid #8a6a30;color:#e0a03d;padding:8px;cursor:pointer}.card{border:1px solid #3d382f;padding:15px;margin:10px 0}.done{border-color:#e0a03d}</style></head><body><div class=wrap><h1>Paris, à Rebours</h1><p>Un carnet de découvertes hors des itinéraires classiques.</p><div class=tabs id=tabs></div><div id=grid></div></div><script>const cats=[['Cabinets de curiosités',['Deyrolle','Musée de la Chasse et de la Nature','Fontaine Stravinsky']],['Contre-cultures',['59 Rivoli','Guinguettes populaires','Mémoire de Mai 68']],['Nature en marge',['Petite Ceinture','Coulée Verte','Jardin partagé']],['Rencontres',['Puces de Saint-Ouen','Bal des pompiers','Conversation imprévue']]];let active=0,done=JSON.parse(localStorage.getItem('paris-rebours')||'{}');cats.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c[0];b.onclick=()=>{active=i;render()};tabs.appendChild(b)});function render(){grid.innerHTML=cats[active][1].map((x,i)=>{let k=active+'-'+i;return `<div class="card ${done[k]?'done':''}"><h3>${x}</h3><p>Découverte à explorer et à documenter personnellement.</p><button onclick="done['${k}']=!done['${k}'];localStorage.setItem('paris-rebours',JSON.stringify(done));render()">${done[k]?'✓ Réalisé':'Je l’ai découvert'}</button></div>`}).join('')}render()</script></body></html>
