<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbres des dieux</title><style>body{margin:0;background:#211a10;color:#e9dfc3;font:16px Georgia;padding:24px}.wrap{max-width:1000px;margin:auto}button{padding:9px 14px;margin:4px;background:#e0c789;border:0;border-radius:20px;cursor:pointer}.tree{background:#e9dfc3;color:#2b2013;padding:20px;margin-top:15px;min-height:400px}.node{display:inline-block;border:1px solid #b8892b;padding:12px;margin:8px;border-radius:8px;background:#f4ebd0}</style></head><body><div class=wrap><h1>Arbres des dieux</h1><p>Explore des généalogies mythologiques par tradition.</p><div id=tabs></div><div id=tree class=tree></div></div><script>const data={Grecque:[['Chaos','Gaïa','Ouranos','Cronos','Zeus'],Egyptienne:['Nout','Geb','Osiris','Isis','Horus'],Nordique:['Borr','Odin','Thor','Baldr','Loki'],Romaine:['Saturne','Jupiter','Neptune','Pluton','Vénus']};Object.keys(data).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k);tabs.appendChild(b)});function show(k){tree.innerHTML='<h2>'+k+'</h2>'+data[k].map((x,i)=>`<div class=node><b>${i+1}</b><br>${x}</div>`).join('')}show('Grecque')</script></body></html>
