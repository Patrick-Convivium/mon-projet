<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photogramme</title><style>body{margin:0;background:#0b0a08;color:#f3eee1;font:14px Georgia;padding:24px}.wrap{max-width:1100px;margin:auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tools input,.tools select{padding:9px;background:#151310;color:#f3eee1;border:1px solid #4a4030}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#ede3ce;color:#241d14;padding:12px;border-left:6px solid #e3a23b;min-height:150px}.card button{padding:7px;border:0;background:#e3a23b;cursor:pointer}</style></head><body><div class=wrap><h1>PHOTOGRAMME</h1><p>Cinémathèque personnelle — catalogue, filtres et progression.</p><div class=tools><input id=q placeholder="Titre ou réalisateur" oninput=render()><select id=dec onchange=render()><option>Toutes les décennies</option><option>1890</option><option>1900</option><option>1920</option><option>1950</option><option>1970</option><option>1990</option><option>2000</option><option>2020</option></select><label><input type=checkbox id=unseen onchange=render()> non vus</label></div><p id=count></p><div class=grid id=grid></div></div><script>const films=[['La Sortie de l’usine Lumière',1895,'Frères Lumière'],['Le Voyage dans la Lune',1902,'Georges Méliès'],['Le Cabinet du docteur Caligari',1920,'Robert Wiene'],['Citizen Kane',1941,'Orson Welles'],['Rashomon',1950,'Akira Kurosawa'],['À bout de souffle',1960,'Jean-Luc Godard'],['2001, l’Odyssée de l’espace',1968,'Stanley Kubrick'],['Le Parrain',1972,'Francis Ford Coppola'],['Alien',1979,'Ridley Scott'],['Blade Runner',1982,'Ridley Scott'],['Retour vers le futur',1985,'Robert Zemeckis'],['Do the Right Thing',1989,'Spike Lee']];let seen=JSON.parse(localStorage.getItem('photogramme')||'{}');function render(){let s=q.value.toLowerCase(),d=dec.value;let arr=films.filter(f=>(!s||(f[0]+' '+f[2]).toLowerCase().includes(s))&&(d==='Toutes les décennies'||String(Math.floor(f[1]/10)*10)===d)&&(!unseen.checked||!seen[f[0]]));count.textContent=arr.length+' film(s)';grid.innerHTML=arr.map(f=>`<article class=card><h3>${f[0]}</h3><small>${f[1]} · ${f[2]}</small><p>${seen[f[0]]?'✓ vu':'à voir'}</p><button onclick="seen['${f[0]}']=!seen['${f[0]}'];localStorage.setItem('photogramme',JSON.stringify(seen));render()">${seen[f[0]]?'Retirer vu':'Marquer vu'}</button></article>`).join('')}render()</script></body></html>
