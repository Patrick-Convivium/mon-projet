<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progression Street Workout</title><style>body{margin:0;background:#1b1b1d;color:#f3f0e7;font:15px system-ui;padding:25px}.wrap{max-width:900px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:12px;background:#2d2d31;color:#f3f0e7;border:2px solid #3c3c41;cursor:pointer}.card{background:#2d2d31;border:2px solid #3c3c41;padding:16px;margin:12px 0}.bar{height:10px;background:#232326;margin:10px 0}.fill{height:100%;background:#ff5a1f}.card button{padding:8px;margin:3px}</style></head><body><div class=wrap><h1>PROGRESSION STREET WORKOUT</h1><p>Travaille les mouvements par niveaux et suis tes validations.</p><div class=tabs id=tabs></div><div id=app></div></div><script>const levels=[['I — Fondations',['Pompes','Squats','Gainage','Tractions assistées']],['II — Intermédiaire',['Tractions','Dips','Pistol squat','L-sit']],['III — Avancé',['Muscle-up','Handstand','Front lever','Planche']]];let state=JSON.parse(localStorage.getItem('streetworkout')||'{}');levels.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>render(i);tabs.appendChild(b)});function render(l=0){app.innerHTML=levels[l][1].map((x,i)=>{let k=l+'-'+i,v=state[k]?1:0;return `<div class=card><h2>${x}</h2><div class=bar><div class=fill style="width:${v*100}%"></div></div><button onclick="state['${k}']=!state['${k}'];localStorage.setItem('streetworkout',JSON.stringify(state));render(${l})">${v?'✓ Validé':'Valider'}</button></div>`}).join('')}render()</script></body></html>
