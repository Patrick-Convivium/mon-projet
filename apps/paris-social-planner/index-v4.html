<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paris Social Planner</title><style>body{margin:0;background:#f5f3ef;color:#202020;font-family:system-ui,-apple-system,sans-serif}header,main{max-width:1180px;margin:auto;padding:24px}h1{margin:0}header p{color:#707070}.toolbar,.hero,.card,.fav{background:white;border:1px solid #ddd9d1;border-radius:18px;padding:16px;margin-bottom:14px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px}label{display:block;font-size:11px;font-weight:800;color:#777;margin-bottom:5px}select,input,button{font:inherit;border:1px solid #ddd9d1;border-radius:10px;padding:10px}button{background:#171717;color:white;font-weight:700;cursor:pointer}.secondary{background:#eeeae3;color:#222}.hero{display:flex;justify-content:space-between;gap:16px}.hero p,.summary,.notice{color:#666}.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{position:relative}.star{position:absolute;right:12px;top:12px;background:transparent;color:#999;border:0;font-size:24px;padding:0}.star.active{color:#b68100}.meta{font-size:11px;color:#777;font-weight:800}.card h2{margin:7px 30px 5px 0;font-size:19px}.actions{display:flex;gap:8px}.actions button{flex:1}details{margin-top:12px;border-top:1px solid #ddd9d1;padding-top:10px}summary{cursor:pointer;font-weight:750}.timeline{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;margin-top:10px}.time{font-size:12px;font-weight:800;color:#777;padding-top:10px}.activity{border:1px solid #ddd9d1;border-radius:12px;padding:10px}.activity small{display:block;color:#666;margin-top:3px}.tag{display:inline-block;background:#eeeae3;border-radius:99px;padding:3px 7px;font-size:10px;margin-top:5px}.favgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.empty{text-align:center;color:#777;padding:18px}@media(max-width:850px){.toolbar,.scenarios,.favgrid{grid-template-columns:1fr}.hero{display:block}}</style><style>:root{--bg:#070b0a;--panel:#101715;--line:#2a3933;--text:#eef6f1;--muted:#9aada4;--accent:#bde8ce;--gold:#dfc98f}body{background:radial-gradient(circle at 50% 0,#172821,#070b0a 48%,#040605);color:var(--text)}header,main{max-width:1240px}.toolbar,.hero,.card,.fav{background:rgba(16,23,21,.96);border-color:var(--line);box-shadow:0 12px 35px rgba(0,0,0,.22)}header p,.hero p,.summary,.empty{color:var(--muted)}label,.meta{color:var(--gold)}select,input,button{background:#0b110f;color:var(--text);border-color:#34443d}.secondary{background:#1a2521;color:var(--text)}.activity{background:#0c1311;border-color:#2d3c36}.activity small{color:#aebdb6}.tag{background:#19241f;color:#b9d8c6}.notice{background:rgba(223,201,143,.06);border-left-color:var(--gold);color:#b8c8c0}.place{color:var(--accent);text-decoration:none;border-bottom:1px dotted #709482}.place:hover{text-decoration:underline}.route{margin-top:12px;padding:11px;border:1px solid #33463d;border-radius:12px;background:#0a100e}.route a{color:var(--accent);font-weight:750}.route-note{color:var(--muted);font-size:11px}.check{color:#a9d9b9}.warning{color:#efaaa0}@media(max-width:900px){.scenarios{grid-template-columns:1fr}}</style></head><body class="dark"><header><h1>Paris Social Planner</h1><p>V4 · programme ouvrable directement, dates et favoris</p></header><main><section class="toolbar"><div><label>PÉRIODE</label><select id="period"><option value="weekend">Ce week-end</option><option value="day">Un jour précis</option><option value="week">Une semaine</option><option value="custom">Période personnalisée</option></select></div><div><label>DATE / DÉBUT</label><input id="start" type="date"></div><div><label>FIN</label><input id="end" type="date"></div><button id="refresh">Générer</button></section><section class="hero"><div><h2 id="title">3 journées proposées</h2><p id="subtitle">Chaque carte contient son programme directement ouvrable.</p></div><button class="secondary" id="reroll">Nouveau tirage</button></section><section id="scenarios" class="scenarios"></section><section class="fav"><h3>⭐ Mes favoris <span id="favcount" class="meta"></span></h3><div id="favorites" class="favgrid"></div></section></main><script>
const P={
cafe:{name:'Le Café des Musées',q:'Le Café des Musées, 49 Rue de Turenne, Paris',lat:48.8597,lon:2.3621,h:'10:00–22:30'},
vosges:{name:'Place des Vosges',q:'Place des Vosges, Paris',lat:48.8554,lon:2.3653,h:'espace public'},
seine:{name:'Berges de Seine',q:'Berges de Seine, Quai d\'Orsay, Paris',lat:48.8592,lon:2.3214,h:'24 h/24'},
branly:{name:'Jardin du Musée du Quai Branly',q:'Jardin du Musée du Quai Branly, Paris',lat:48.8600,lon:2.2978,h:'10:00–19:00'},
tokyo:{name:'Café du Palais de Tokyo',q:'Café du Palais de Tokyo, Paris',lat:48.8647,lon:2.2971,h:'12:00–22:00'},
montsouris:{name:'Parc Montsouris',q:'Parc Montsouris, Paris',lat:48.8226,lon:2.3388,h:'07:00–20:30'},
brassens:{name:'Parc Georges-Brassens',q:'Parc Georges-Brassens, Paris',lat:48.8330,lon:2.3008,h:'08:00–20:30'},
wanted:{name:'Wanted Café Paris',q:'Wanted Café Paris, 70 Rue du Faubourg Saint-Martin, Paris',lat:48.8717,lon:2.3572,h:'08:00–01:00'},
pavillon:{name:'Le Pavillon des Canaux',q:'Le Pavillon des Canaux, 39 Quai de la Loire, Paris',lat:48.8870,lon:2.3744,h:'11:00–00:00'}
};
const S=[
{name:'Marais → Seine → Palais de Tokyo',summary:'Un seul axe géographique, du Marais vers la Seine puis le 16e, sans aller-retour artificiel.',steps:[['10:30','Café','cafe','Café et départ tranquille.'],['11:30','Place des Vosges','vosges','Balade courte dans le Marais.'],['13:00','Berges de Seine','seine','Descente vers la Seine et marche panoramique.'],['15:30','Jardin du Quai Branly','branly','Pause verte au bord du musée.'],['17:30','Café du Palais de Tokyo','tokyo','Pause café et possibilité de prolonger culturellement.']]},
{name:'Montsouris → Georges-Brassens → Seine',summary:'Une journée dans le sud-ouest parisien, avec deux parcs puis une arrivée sur les quais.',steps:[['10:00','Parc Montsouris','montsouris','Grande boucle matinale.'],['12:30','Parc Georges-Brassens','brassens','Deuxième séquence verte et pause locale.'],['15:30','Berges de Seine','seine','Fin d’après-midi au bord de l’eau.'],['17:30','Wanted Café Paris','wanted','Retour vers un lieu social ouvert en soirée.']]},
{name:'Canal Saint-Martin → Villette',summary:'Un parcours nord-est cohérent, du café vers le canal et la Villette, sans zigzag.',steps:[['10:00','Wanted Café Paris','wanted','Petit-déjeuner ou café.'],['11:30','Pavillon des Canaux','pavillon','Progression vers le bassin de la Villette.'],['14:00','Bassin de la Villette','pavillon','Balade libre autour du bassin.'],['16:30','Pavillon des Canaux','pavillon','Pause finale au bord de l’eau.']]}
];
let fav=JSON.parse(localStorage.getItem('psp4fav')||'[]');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));
const fmt=v=>new Date(v+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
function maps(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q)}
function dir(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.q)+'&destination='+encodeURIComponent(b.q)+'&travelmode=walking'}
function km(a,b){const R=6371,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dq=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dq/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function toggle(n){fav=fav.includes(n)?fav.filter(x=>x!==n):fav.concat(n);localStorage.setItem('psp4fav',JSON.stringify(fav));render()}
function card(s,i){let total=0,rows='';for(let j=0;j<s.steps.length;j++){const x=s.steps[j],p=P[x[2]],next=s.steps[j+1];if(next)total+=km(p,P[next[2]]);rows+='<div class="time">'+x[0]+'</div><div class="activity"><b><a class="place" target="_blank" rel="noopener" href="'+maps(p)+'">'+esc(x[1])+'</a></b><small>'+esc(p.name)+' · '+esc(x[3])+'</small><span class="tag">'+esc(p.h)+'</span>'+(next?'<div class="route-note">→ '+km(p,P[next[2]]).toFixed(1)+' km estimés · <a target="_blank" rel="noopener" href="'+dir(p,P[next[2]])+'">itinéraire piéton Google Maps</a></div>':'')+'</div>'}return '<article class="card"><button class="star '+(fav.includes(s.name)?'active':'')+'" data-fav="'+esc(s.name)+'">★</button><div class="meta">PARCOURS '+i+' · HORAIRES À CONTRÔLER</div><h2>'+esc(s.name)+'</h2><p class="summary">'+esc(s.summary)+'</p><div class="route"><strong>'+total.toFixed(1)+' km cumulés entre étapes</strong><br><span class="route-note">Distance géographique calculée entre coordonnées ; Google Maps recalcule le vrai chemin piéton.</span><br><a target="_blank" rel="noopener" href="'+dir(P[s.steps[0][2]],P[s.steps[s.steps.length-1][2]])+'">Voir le tracé complet dans Google Maps →</a></div><div class="actions"><button type="button" class="program-btn">Voir le programme</button></div><details><summary>Étapes, lieux et trajets</summary><div class="timeline">'+rows+'</div></details></article>'}
function render(){document.getElementById('scenarios').innerHTML=S.map(card).join('');document.getElementById('favcount').textContent='· '+fav.length+' favori'+(fav.length>1?'s':'');document.getElementById('favorites').innerHTML=fav.length?S.filter(s=>fav.includes(s.name)).map(card).join(''):'<div class="empty">Aucun favori pour le moment.</div>';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggle(b.dataset.fav));document.querySelectorAll('.program-btn').forEach(b=>b.onclick=()=>{const d=b.closest('.card').querySelector('details');d.open=!d.open;b.textContent=d.open?'Masquer le programme':'Voir le programme'})}
function generate(){const p=document.getElementById('period').value,st=document.getElementById('start').value||new Date().toISOString().slice(0,10),en=document.getElementById('end').value;document.getElementById('title').textContent=p==='day'?fmt(st):p==='week'?('Semaine du '+fmt(st)):p==='custom'&&en?(fmt(st)+' → '+fmt(en)):'Ce week-end · parcours géographiques';render()}
document.getElementById('refresh').onclick=generate;document.getElementById('reroll').onclick=()=>{S.push(S.shift());render()};document.getElementById('period').onchange=generate;document.getElementById('start').onchange=generate;document.getElementById('end').onchange=generate;document.getElementById('start').value=new Date().toISOString().slice(0,10);generate();
</script></body></html>
