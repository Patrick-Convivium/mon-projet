<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paris Social Planner</title><style>body{margin:0;background:#f5f3ef;color:#202020;font-family:system-ui,-apple-system,sans-serif}header,main{max-width:1180px;margin:auto;padding:24px}h1{margin:0}header p{color:#707070}.toolbar,.hero,.card,.fav{background:white;border:1px solid #ddd9d1;border-radius:18px;padding:16px;margin-bottom:14px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px}label{display:block;font-size:11px;font-weight:800;color:#777;margin-bottom:5px}select,input,button{font:inherit;border:1px solid #ddd9d1;border-radius:10px;padding:10px}button{background:#171717;color:white;font-weight:700;cursor:pointer}.secondary{background:#eeeae3;color:#222}.hero{display:flex;justify-content:space-between;gap:16px}.hero p,.summary,.notice{color:#666}.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{position:relative}.star{position:absolute;right:12px;top:12px;background:transparent;color:#999;border:0;font-size:24px;padding:0}.star.active{color:#b68100}.meta{font-size:11px;color:#777;font-weight:800}.card h2{margin:7px 30px 5px 0;font-size:19px}.actions{display:flex;gap:8px}.actions button{flex:1}details{margin-top:12px;border-top:1px solid #ddd9d1;padding-top:10px}summary{cursor:pointer;font-weight:750}.timeline{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;margin-top:10px}.time{font-size:12px;font-weight:800;color:#777;padding-top:10px}.activity{border:1px solid #ddd9d1;border-radius:12px;padding:10px}.activity small{display:block;color:#666;margin-top:3px}.tag{display:inline-block;background:#eeeae3;border-radius:99px;padding:3px 7px;font-size:10px;margin-top:5px}.favgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.empty{text-align:center;color:#777;padding:18px}@media(max-width:850px){.toolbar,.scenarios,.favgrid{grid-template-columns:1fr}.hero{display:block}}</style><style>:root{--bg:#070b0a;--panel:#101715;--line:#2a3933;--text:#eef6f1;--muted:#9aada4;--accent:#bde8ce;--gold:#dfc98f}body{background:radial-gradient(circle at 50% 0,#172821,#070b0a 48%,#040605);color:var(--text)}header,main{max-width:1240px}.toolbar,.hero,.card,.fav{background:rgba(16,23,21,.96);border-color:var(--line);box-shadow:0 12px 35px rgba(0,0,0,.22)}header p,.hero p,.summary,.empty{color:var(--muted)}label,.meta{color:var(--gold)}select,input,button{background:#0b110f;color:var(--text);border-color:#34443d}.secondary{background:#1a2521;color:var(--text)}.activity{background:#0c1311;border-color:#2d3c36}.activity small{color:#aebdb6}.tag{background:#19241f;color:#b9d8c6}.notice{background:rgba(223,201,143,.06);border-left-color:var(--gold);color:#b8c8c0}.place{color:var(--accent);text-decoration:none;border-bottom:1px dotted #709482}.place:hover{text-decoration:underline}.route{margin-top:12px;padding:11px;border:1px solid #33463d;border-radius:12px;background:#0a100e}.route a{color:var(--accent);font-weight:750}.route-note{color:var(--muted);font-size:11px}.check{color:#a9d9b9}.warning{color:#efaaa0}@media(max-width:900px){.scenarios{grid-template-columns:1fr}}</style></head><body class="dark"><header><h1>Paris Social Planner</h1><p>V4 · programme ouvrable directement, dates et favoris</p></header><main><section class="toolbar"><div><label>PÉRIODE</label><select id="period"><option value="weekend">Ce week-end</option><option value="day">Un jour précis</option><option value="week">Une semaine</option><option value="custom">Période personnalisée</option></select></div><div><label>DATE / DÉBUT</label><input id="start" type="date"></div><div><label>FIN</label><input id="end" type="date"></div><button id="refresh">Générer</button></section><section class="hero"><div><h2 id="title">3 journées proposées</h2><p id="subtitle">Chaque carte contient son programme directement ouvrable.</p></div><button class="secondary" id="reroll">Nouveau tirage</button></section><section id="scenarios" class="scenarios"></section><section class="fav"><h3>⭐ Mes favoris <span id="favcount" class="meta"></span></h3><div id="favorites" class="favgrid"></div></section></main><script>
const P={
cafe:{name:'Le Café des Musées',q:'Le Café des Musées, 49 Rue de Turenne, Paris',lat:48.8597,lon:2.3621,h:'10:00–22:30'},
vosges:{name:'Place des Vosges',q:'Place des Vosges, Paris',lat:48.8554,lon:2.3653,h:'espace public'},
seine:{name:'Berges de Seine',q:"Berges de Seine, Quai d'Orsay, Paris",lat:48.8592,lon:2.3214,h:'24 h/24'},
branly:{name:'Jardin du Musée du Quai Branly',q:'Jardin du Musée du Quai Branly, Paris',lat:48.8600,lon:2.2978,h:'10:00–19:00'},
tokyo:{name:'Café du Palais de Tokyo',q:'Café du Palais de Tokyo, Paris',lat:48.8647,lon:2.2971,h:'12:00–22:00'},
montsouris:{name:'Parc Montsouris',q:'Parc Montsouris, Paris',lat:48.8226,lon:2.3388,h:'07:00–20:30'},
brassens:{name:'Parc Georges-Brassens',q:'Parc Georges-Brassens, Paris',lat:48.8330,lon:2.3008,h:'08:00–20:30'},
wanted:{name:'Wanted Café Paris',q:'Wanted Café Paris, 70 Rue du Faubourg Saint-Martin, Paris',lat:48.8717,lon:2.3572,h:'08:00–01:00'},
pavillon:{name:'Le Pavillon des Canaux',q:'Le Pavillon des Canaux, 39 Quai de la Loire, Paris',lat:48.8870,lon:2.3744,h:'11:00–00:00'},
buttes:{name:'Parc des Buttes-Chaumont',q:'Parc des Buttes-Chaumont, Paris',lat:48.8809,lon:2.3828,h:'07:00–21:00'},
chapeau:{name:'Parc de la Butte du Chapeau Rouge',q:'Parc de la Butte du Chapeau Rouge, Paris',lat:48.8777,lon:2.4052,h:'07:00–20:30'},
floral:{name:'Parc Floral de Paris',q:'Parc Floral de Paris',lat:48.8375,lon:2.4399,h:'09:30–20:00'}
};
const T=[
{name:'Marais → Seine → Palais de Tokyo',zone:'centre-ouest',steps:[['10:00','Café · Le Café des Musées','cafe','Départ café dans le Marais.'],['11:15','Place des Vosges','vosges','Balade et découverte du Marais.'],['12:45','Déjeuner · Berges de Seine','seine','Déjeuner libre puis descente vers les quais.'],['14:30','Berges de Seine','seine','Longue marche panoramique le long de la Seine.'],['16:00','Jardin du Quai Branly','branly','Pause verte et découverte du quartier.'],['17:45','Café du Palais de Tokyo','tokyo','Pause café et temps libre.'],['19:30','Dîner · Palais de Tokyo / Trocadéro','tokyo','Fin de journée dans le secteur.'],['21:00','Trocadéro','tokyo','Balade nocturne finale.']]},
{name:'Montsouris → Georges-Brassens → Seine',zone:'sud-ouest',steps:[['10:00','Parc Montsouris','montsouris','Grande boucle matinale.'],['11:45','Parc Montsouris','montsouris','Temps libre, lac et pelouses.'],['13:00','Déjeuner · Georges-Brassens','brassens','Déjeuner et pause dans le 15e.'],['14:15','Parc Georges-Brassens','brassens','Promenade et découverte du parc.'],['16:00','Berges de Seine','seine','Trajet vers la Seine puis marche.'],['17:30','Berges de Seine','seine','Pause en bord d’eau.'],['19:00','Wanted Café Paris','wanted','Dîner léger ou verre en soirée.'],['21:00','Canal Saint-Martin','wanted','Balade finale vers le canal.']]},
{name:'Canal Saint-Martin → Villette',zone:'nord-est',steps:[['10:00','Wanted Café Paris','wanted','Petit-déjeuner et départ.'],['11:15','Canal Saint-Martin','wanted','Marche le long du canal.'],['12:30','Déjeuner · Pavillon des Canaux','pavillon','Pause déjeuner au bord de l’eau.'],['14:00','Bassin de la Villette','pavillon','Grande promenade autour du bassin.'],['15:45','Bassin de la Villette','pavillon','Temps libre et terrasses.'],['17:30','Pavillon des Canaux','pavillon','Pause café.'],['19:00','Bassin de la Villette','pavillon','Dîner dans le secteur.'],['21:00','Villette','pavillon','Fin de soirée autour du bassin.']]},
{name:'Buttes-Chaumont → Belleville → Canal',zone:'nord-est',steps:[['09:30','Parc des Buttes-Chaumont','buttes','Grande boucle matinale et belvédère.'],['11:30','Parc des Buttes-Chaumont','buttes','Temps libre dans le parc.'],['13:00','Déjeuner · Belleville','wanted','Déjeuner dans le quartier.'],['14:30','Belleville','wanted','Promenade urbaine et points de vue.'],['16:00','Canal Saint-Martin','wanted','Descente progressive vers le canal.'],['17:30','Canal Saint-Martin','wanted','Pause et balade.'],['19:00','Wanted Café Paris','wanted','Dîner ou verre.'],['21:00','Canal Saint-Martin','wanted','Fin de parcours.']]},
{name:'Chapeau Rouge → Villette → Canal',zone:'nord-est',steps:[['10:00','Parc de la Butte du Chapeau Rouge','chapeau','Promenade matinale.'],['11:30','Parc de la Butte du Chapeau Rouge','chapeau','Temps libre et pause.'],['13:00','Déjeuner · Villette','pavillon','Déjeuner près du bassin.'],['14:30','Bassin de la Villette','pavillon','Promenade autour du bassin.'],['16:00','Le Pavillon des Canaux','pavillon','Pause café.'],['17:30','Canal de l’Ourcq','pavillon','Marche au fil de l’eau.'],['19:30','Villette','pavillon','Dîner dans le quartier.'],['21:00','Bassin de la Villette','pavillon','Fin de soirée.']]},
{name:'Montsouris → Brassens → Paris sud',zone:'sud',steps:[['09:30','Parc Montsouris','montsouris','Matinée nature.'],['11:30','Cité Universitaire','montsouris','Promenade autour du secteur.'],['13:00','Déjeuner · Georges-Brassens','brassens','Pause déjeuner.'],['14:30','Parc Georges-Brassens','brassens','Après-midi au parc.'],['16:30','Berges de Seine','seine','Descente vers les quais.'],['18:00','Berges de Seine','seine','Balade en bord d’eau.'],['19:30','Wanted Café Paris','wanted','Dîner ou verre.'],['21:00','Paris sud-ouest','wanted','Fin de parcours.']]}
];
let fav=JSON.parse(localStorage.getItem('psp4fav')||'[]');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>new Date(v+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
function maps(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q)}
function dir(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.q)+'&destination='+encodeURIComponent(b.q)+'&travelmode=walking'}
function km(a,b){const R=6371,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dq=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dq/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function timeMin(v){let [h,m]=v.split(':').map(Number);return h*60+m}
function validStep(step,date){const p=P[step[2]];if(step[2]==='vosges'||step[2]==='seine')return true;const t=timeMin(step[0]),[a,b]=p.h.split('–').map(timeMin);return t>=a&&t<=b}
function compatible(t,date){return t.steps.every(x=>validStep(x,date))}
function pick(period,date){let pool=T.filter(x=>compatible(x,date));if(period==='day')return pool.slice(0,3);if(period==='weekend')return pool.slice(0,3);if(period==='week')return pool.slice(0,5);return pool.slice(0,3)}
function card(t,i,date){let total=0,rows='';for(let j=0;j<t.steps.length;j++){const x=t.steps[j],p=P[x[2]],n=t.steps[j+1];if(n)total+=km(p,P[n[2]]);rows+='<div class="time">'+x[0]+'</div><div class="activity"><b><a class="place" target="_blank" rel="noopener" href="'+maps(p)+'">'+esc(x[1])+'</a></b><small>'+esc(p.name)+' · '+esc(x[3])+'</small><span class="tag">Ouvert / accessible à cette heure</span>'+(n?'<div class="route-note">→ '+km(p,P[n[2]]).toFixed(1)+' km géographiques · <a target="_blank" rel="noopener" href="'+dir(p,P[n[2]])+'">itinéraire piéton Google Maps</a></div>':'')+'</div>'}return '<article class="card"><button class="star '+(fav.includes(t.name)?'active':'')+'" data-fav="'+esc(t.name)+'" type="button">★</button><div class="meta">PROGRAMME '+i+' · '+fmt(date).toUpperCase()+'</div><h2>'+esc(t.name)+'</h2><p class="summary">09:30/10:00 → 21:00 · journée complète · secteur '+esc(t.zone)+'</p><div class="route"><strong>'+total.toFixed(1)+' km géographiques entre étapes</strong><br><span class="route-note">Le parcours est construit comme une journée continue. Google Maps recalcule les trajets piétons réels.</span></div><div class="actions"><button type="button" class="program-btn">Voir le programme</button></div><details><summary>Journée complète · 8 étapes</summary><div class="timeline">'+rows+'</div></details></article>'}
function render(date,period){const arr=pick(period,date);document.getElementById('scenarios').innerHTML=arr.length?arr.map((t,i)=>card(t,i+1,date)).join(''):'<div class="empty">Aucun programme compatible avec cette date. Choisissez une autre date.</div>';document.getElementById('favcount').textContent='· '+fav.length+' favori'+(fav.length>1?'s':'');document.getElementById('favorites').innerHTML=fav.length?arr.filter(t=>fav.includes(t.name)).map((t,i)=>card(t,i+1,date)).join(''):'<div class="empty">Aucun favori pour cette période.</div>';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggle(b.dataset.fav));document.querySelectorAll('.program-btn').forEach(b=>b.onclick=()=>{const d=b.closest('.card').querySelector('details');d.open=!d.open;b.textContent=d.open?'Masquer le programme':'Voir le programme'})}
function toggle(n){fav=fav.includes(n)?fav.filter(x=>x!==n):fav.concat(n);localStorage.setItem('psp4fav',JSON.stringify(fav));generate()}
function generate(){const period=document.getElementById('period').value;const st=document.getElementById('start').value||new Date().toISOString().slice(0,10);const en=document.getElementById('end').value;let date=st;if(period==='weekend'){const d=new Date(st+'T12:00');const day=d.getDay();let add=(6-day+7)%7;if(day===0)add=6;d.setDate(d.getDate()+add);date=d.toISOString().slice(0,10)}document.getElementById('title').textContent=period==='day'?'Journée complète · '+fmt(date):period==='weekend'?'Week-end · programmes complets':period==='week'?'Semaine · programmes complets':period==='custom'&&en?'Période personnalisée · '+fmt(date)+' → '+fmt(en):'Programmes complets';document.getElementById('subtitle').textContent=period==='day'?'3 journées différentes, construites pour cette date.':period==='weekend'?'Programmes adaptés au week-end et au samedi/dimanche.':period==='week'?'5 journées différentes pour explorer Paris sans répéter le même parcours.':'Programmes générés dans la période choisie.';render(date,period)}
document.getElementById('refresh').onclick=generate;document.getElementById('reroll').onclick=()=>{T.push(T.shift());generate()};document.getElementById('period').onchange=generate;document.getElementById('start').onchange=generate;document.getElementById('end').onchange=generate;document.getElementById('start').value=new Date().toISOString().slice(0,10);generate();
</script></body></html>
