<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paris Social Planner</title><style>body{margin:0;background:#f5f3ef;color:#202020;font-family:system-ui,-apple-system,sans-serif}header,main{max-width:1180px;margin:auto;padding:24px}h1{margin:0}header p{color:#707070}.toolbar,.hero,.card,.fav{background:white;border:1px solid #ddd9d1;border-radius:18px;padding:16px;margin-bottom:14px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px}label{display:block;font-size:11px;font-weight:800;color:#777;margin-bottom:5px}select,input,button{font:inherit;border:1px solid #ddd9d1;border-radius:10px;padding:10px}button{background:#171717;color:white;font-weight:700;cursor:pointer}.secondary{background:#eeeae3;color:#222}.hero{display:flex;justify-content:space-between;gap:16px}.hero p,.summary,.notice{color:#666}.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{position:relative}.star{position:absolute;right:12px;top:12px;background:transparent;color:#999;border:0;font-size:24px;padding:0}.star.active{color:#b68100}.meta{font-size:11px;color:#777;font-weight:800}.card h2{margin:7px 30px 5px 0;font-size:19px}.actions{display:flex;gap:8px}.actions button{flex:1}details{margin-top:12px;border-top:1px solid #ddd9d1;padding-top:10px}summary{cursor:pointer;font-weight:750}.timeline{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;margin-top:10px}.time{font-size:12px;font-weight:800;color:#777;padding-top:10px}.activity{border:1px solid #ddd9d1;border-radius:12px;padding:10px}.activity small{display:block;color:#666;margin-top:3px}.tag{display:inline-block;background:#eeeae3;border-radius:99px;padding:3px 7px;font-size:10px;margin-top:5px}.favgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.empty{text-align:center;color:#777;padding:18px}@media(max-width:850px){.toolbar,.scenarios,.favgrid{grid-template-columns:1fr}.hero{display:block}} </style></head><body><header><h1>Paris Social Planner</h1><p>V4 · programme ouvrable directement, dates et favoris</p></header><main><section class="toolbar"><div><label>PÉRIODE</label><select id="period"><option value="weekend">Ce week-end</option><option value="day">Un jour précis</option><option value="week">Une semaine</option><option value="custom">Période personnalisée</option></select></div><div><label>DATE / DÉBUT</label><input id="start" type="date"></div><div><label>FIN</label><input id="end" type="date"></div><button id="refresh">Générer</button></section><section class="hero"><div><h2 id="title">3 journées proposées</h2><p id="subtitle">Chaque carte contient maintenant son programme directement ouvrable.</p></div><button class="secondary" id="reroll">Nouveau tirage</button></section><section id="scenarios" class="scenarios"></section><section class="fav"><h3>⭐ Mes favoris <span id="favcount" class="meta"></span></h3><div id="favorites" class="favgrid"></div></section></main><script>const S=[{name:'Culture → terrasse → concert',summary:'Culture, promenade et moments sociaux.',days:[['09:30','Café + balade','Commencer tranquillement dans un café puis marcher.','Food'],['11:00','Exposition','Visiter une exposition et échanger seulement si le contexte s’y prête.','Culture'],['13:15','Déjeuner','Déjeuner en terrasse ou lieu convivial.','Food'],['15:00','Promenade Seine','Balade publique et architecture.','Promenade'],['17:00','Galerie / librairie','Activité culturelle légère.','Culture'],['19:30','Apéro','Continuer une conversation uniquement si l’intérêt est réciproque.','Food'],['21:00','Concert','Échanger avant ou après la prestation.','Musique']]},{name:'Marché → atelier → jeux',summary:'Une journée participative sans forcer l’approche.',days:[['10:00','Marché','Explorer un marché et prendre un café.','Food'],['11:30','Atelier','Céramique, cuisine, dessin ou photo.','Atelier'],['13:30','Déjeuner','Table partagée ou restaurant convivial.','Food'],['15:00','Parc','Balade dans un parc.','Promenade'],['17:00','Café ludique','Rejoindre une table qui accepte de nouveaux joueurs.','Jeu'],['19:30','Dîner','Restaurant convivial ou food hall.','Food'],['21:30','Quiz / blind test','Événement explicitement collectif.','Jeu']]},{name:'Sport → brunch → danse',summary:'Une journée dynamique où l’activité crée l’interaction.',days:[['09:30','Course collective','Course, marche ou séance associative.','Sport'],['11:30','Brunch','Brunch dans un quartier vivant.','Food'],['13:30','Balade','Découvrir un quartier.','Promenade'],['15:30','Musée','Visite courte puis pause.','Culture'],['18:00','Danse sociale','Cours ou bal où l’invitation fait partie du format.','Musique'],['20:00','Dîner','Dîner convivial.','Food'],['22:00','Soirée dansante','Poursuivre seulement si l’intérêt est réciproque.','Musique']]}];let fav=JSON.parse(localStorage.getItem('psp3fav')||'[]');const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const fmt=v=>new Date(v+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});function toggle(n){fav=fav.includes(n)?fav.filter(x=>x!==n):[...fav,n];localStorage.setItem('psp3fav',JSON.stringify(fav));render()}function card(s,i){return `<article class="card"><button class="star ${fav.includes(s.name)?'active':''}" data-fav="${esc(s.name)}">★</button><div class="meta">JOURNÉE ${i} · 7 ÉTAPES</div><h2>${esc(s.name)}</h2><p class="summary">${esc(s.summary)}</p><div class="actions"><button type="button" onclick="this.closest('details')?.removeAttribute('open')">Programme ci-dessous</button></div><details><summary>Voir le programme</summary><div class="timeline">${s.days.map(x=>`<div class="time">${x[0]}</div><div class="activity"><b>${esc(x[1])}</b><small>${esc(x[2])}</small><span class="tag">${esc(x[3])}</span></div>`).join('')}</div></details></article>`}function render(){const cards=S.map((s,i)=>card(s,i+1)).join('');document.getElementById('scenarios').innerHTML=cards;document.getElementById('favcount').textContent=`· ${fav.length} favori${fav.length>1?'s':''}`;document.getElementById('favorites').innerHTML=fav.length?S.filter(s=>fav.includes(s.name)).map((s,i)=>card(s,i+1)).join(''):'<div class="empty">Aucun favori pour le moment.</div>';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggle(b.dataset.fav))}function generate(){const p=document.getElementById('period').value,st=document.getElementById('start').value||new Date().toISOString().slice(0,10),en=document.getElementById('end').value;document.getElementById('title').textContent=p==='day'?fmt(st):p==='week'?`Semaine du ${fmt(st)}`:p==='custom'&&en?`${fmt(st)} → ${fmt(en)}`:'Ce week-end';render()}document.getElementById('refresh').onclick=generate;document.getElementById('reroll').onclick=()=>{S.push(S.shift());render()};document.getElementById('period').onchange=generate;document.getElementById('start').onchange=generate;document.getElementById('end').onchange=generate;document.getElementById('start').value=new Date().toISOString().slice(0,10);generate();</script></body></html>
