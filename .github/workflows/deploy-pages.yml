name: Deploy mini-apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build application catalog automatically
        shell: python
        run: |
          from pathlib import Path
          from html import unescape
          import re

          root = Path('apps')
          site = Path('_site')
          site.mkdir(parents=True, exist_ok=True)
          (site / 'apps').mkdir(parents=True, exist_ok=True)

          def title_for(path):
              text = path.read_text(encoding='utf-8', errors='ignore')
              m = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
              if m:
                  title = re.sub(r'\\s+', ' ', unescape(re.sub(r'<[^>]+>', '', m.group(1)))).strip()
                  if title:
                      return title
              return path.parent.name.replace('-', ' ').replace('_', ' ').title()

          apps = []
          for directory in sorted(p for p in root.iterdir() if p.is_dir()):
              entry = directory / 'index-v4.html' if (directory / 'index-v4.html').is_file() else directory / 'index.html'
              if entry.is_file():
                  apps.append((title_for(entry), f"apps/{directory.name}/{entry.name}"))

          if not apps:
              raise SystemExit('Aucune mini-app avec un point d\'entrée index.html/index-v4.html n\'a été trouvée dans apps/.')

          cards = '\n'.join(
              f'<a class="card" href="{href}"><strong>{title}</strong><span>Ouvrir l\'application →</span></a>'
              for title, href in apps
          )

          html = f'''<!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Centre applicatif</title>
            <style>
              body{{margin:0;background:#f5f3ef;color:#202020;font-family:system-ui,-apple-system,sans-serif}}
              main{{max-width:1100px;margin:auto;padding:32px 20px}}
              h1{{margin:0 0 8px}}
              .intro{{color:#666;margin-bottom:24px}}
              .grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}}
              .card{{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #ddd9d1;border-radius:18px;padding:18px;text-decoration:none;color:inherit;min-height:80px}}
              .card:hover{{transform:translateY(-2px)}}
              .card span{{color:#666;font-size:14px}}
              footer{{margin-top:28px;color:#888;font-size:12px}}
            </style>
          </head>
          <body>
            <main>
              <h1>Centre applicatif</h1>
              <p class="intro">Toutes les mini-apps présentes dans <code>apps/</code> sont détectées et publiées automatiquement.</p>
              <section class="grid">{cards}</section>
              <footer>{len(apps)} application(s) détectée(s) automatiquement.</footer>
            </main>
          </body>
          </html>'''
          (site / 'index.html').write_text(html, encoding='utf-8')
          print(f'Catalogue généré : {len(apps)} applications')

      - name: Copy all mini-apps
        run: cp -R apps/. _site/apps/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
