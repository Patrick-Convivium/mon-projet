name: Deploy mini-apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build catalog
        shell: python
        run: |
          from pathlib import Path
          from html import unescape
          import re
          root=Path('apps'); site=Path('_site'); (site/'apps').mkdir(parents=True,exist_ok=True)
          apps=[]
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              e=d/'index-v4.html' if (d/'index-v4.html').is_file() else d/'index.html'
              if e.is_file():
                  t=e.read_text(encoding='utf-8',errors='ignore'); m=re.search(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)
                  title=re.sub(r'\s+',' ',unescape(re.sub(r'<[^>]+>','',m.group(1)))).strip() if m else d.name.replace('-',' ').title()
                  apps.append((title,f'apps/{d.name}/{e.name}'))
          cards=''.join(f'<a href="{h}"><i>{i:02d}</i><strong>{x}</strong><small>ouvrir →</small></a>' for i,(x,h) in enumerate(apps,1))
          page=f'''<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centre applicatif</title><style>:root{{--g:#45ff91;--bg:#020604;--p:#07120c;--l:#17472b;--t:#dcf7e6;--m:#709982}}*{{box-sizing:border-box}}body{{margin:0;background:var(--bg);color:var(--t);font:15px "SFMono-Regular",Consolas,monospace}}#m{{position:fixed;inset:0;width:100%;height:100%;opacity:.14;z-index:-1}}main{{max-width:1100px;margin:auto;padding:42px 18px}}header{{padding:24px 0;border-bottom:1px solid var(--l);margin-bottom:20px}}.status{{color:var(--g);font-size:11px;letter-spacing:.12em}}h1{{font-size:clamp(34px,7vw,64px);margin:12px 0 6px}}p,small{{color:var(--m)}}.grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}}a{{display:flex;flex-direction:column;min-height:125px;padding:18px;border:1px solid var(--l);border-radius:14px;background:rgba(5,18,10,.9);color:inherit;text-decoration:none;transition:.2s}}a:hover{{transform:translateY(-3px);border-color:var(--g);box-shadow:0 0 20px #45ff9114}}i{{font-style:normal;color:var(--g);font-size:11px;margin-bottom:18px}}strong{{font-size:16px}}small{{margin-top:auto;padding-top:14px}}footer{{margin-top:20px;color:#426a50;font-size:10px}}@media(prefers-reduced-motion:reduce){{#m{{display:none}}a{{transition:none}}}}</style></head><body><canvas id="m"></canvas><main><header><div class="status">● SYSTÈME // CENTRE APPLICATIF</div><h1>MON PROJET</h1><p>Accès aux mini-applications, carnets et outils interactifs.</p></header><section class="grid">{cards}</section><footer>{len(apps)} modules · apps/ · publication automatique</footer></main><script>const c=document.getElementById('m'),x=c.getContext('2d');let w,h,n,d;function s(){{w=innerWidth;h=innerHeight;c.width=w;c.height=h;n=Math.ceil(w/18);d=Array.from({{length:n}},()=>Math.random()*-40)}}function r(){{x.fillStyle='rgba(2,6,4,.09)';x.fillRect(0,0,w,h);x.font='12px monospace';for(let i=0;i<n;i++){{x.fillStyle='rgba(69,255,145,.45)';x.fillText(Math.random()>.5?'1':'0',i*18,d[i]*18);d[i]+=.7;if(d[i]*18>h)d[i]=Math.random()*-30}}requestAnimationFrame(r)}}s();addEventListener('resize',s);r();</script></body></html>'''
          (site/'index.html').write_text(page,encoding='utf-8')
      - name: Copy apps
        run: cp -R apps/. _site/apps/
      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
